apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-argo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Dzana-K/masters.git
    targetRevision: main
    path: blog-cms/charts/blog-cms
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
